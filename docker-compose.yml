# Local Postgres for Chaos Cartel dev.
# Usage:
#   docker compose up -d
#   cp .env.example .env    # DATABASE_URL matches these creds
#   npm install && npm run dev
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: chaos-cartel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chaoscartel
      POSTGRES_PASSWORD: chaoscartel_dev
      POSTGRES_DB: chaoscartel
    ports:
      - "5432:5432"
    volumes:
      - chaos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaoscartel -d chaoscartel"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  chaos_pgdata:
